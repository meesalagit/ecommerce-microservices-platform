spring.application.name=product-service

# Secrets live in secrets.properties (git-ignored) locally, or come from env vars in Docker/CI
spring.config.import=optional:classpath:secrets.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_product_db
spring.datasource.username=meesala

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Other services (localhost when running in IntelliJ, container names in Docker)
services.user-url=${USER_SERVICE_URL:http://localhost:8080}
