spring.application.name=user-service

# Secrets live in secrets.properties (git-ignored) locally, or come from env vars in Docker/CI
spring.config.import=optional:classpath:secrets.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_user_db
spring.datasource.username=meesala

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.deserialization.fail-on-unknown-properties=true
jwt.expiration=3600000
