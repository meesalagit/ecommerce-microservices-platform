spring.application.name=order-service

# Secrets live in secrets.properties (git-ignored) locally, or come from env vars in Docker/CI
spring.config.import=optional:classpath:secrets.properties

server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_order_db
spring.datasource.username=meesala

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Other services (localhost when running in IntelliJ, container names in Docker)
services.user-url=${USER_SERVICE_URL:http://localhost:8080}
services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8081}
services.inventory-url=${INVENTORY_SERVICE_URL:http://localhost:8082}
